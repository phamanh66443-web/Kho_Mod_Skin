 {id:3,name:'khach01',pass:'x',role:'user',email:'khach01@mail.com',coin:20000}];
const CATS=['Mod lẻ','Mod nhân vật','Mod súng','Mod khác'];
const GRAD=['#6d28d9,#0ea5e9','#be123c,#f97316','#047857,#22d3ee','#1d4ed8,#a855f7','#b45309,#facc15','#0f766e,#84cc16'];
let posts=[];
let S={user:null,view:'home',cat:'Tất cả',q:'',page:1,openId:null,tab:'members'};
try{const u=sessionStorage.getItem('u');if(u)S.user=JSON.parse(u)}catch(e){}

/* ===== 2. PHÂN QUYỀN: mỗi vai trò = một danh sách quyền ===== */
const PERMS={guest:['read'],user:['read'],admin:['read','manage_posts','manage_users']};
const can=p=>(PERMS[S.user?S.user.role:'guest']||[]).includes(p);
function requireAdmin(){ // "người gác cổng" - chặn mọi thao tác admin
  if(!can('manage_posts')){toast('Không đủ quyền: chỉ admin mới vào được');go(S.user?'home':'login');return false}return true}

/* ===== 3. ROUTER: một web, nhiều "trang" ===== */
const $=s=>document.querySelector(s),app=$('#app');
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tb=(p,x='')=>p.img?`<div class="thumb img" style="background-image:url('${p.img}');${x}"></div>`:`<div class="thumb" style="background:linear-gradient(135deg,${p.g});${x}">${esc(p.title.split(' ').slice(0,3).join(' '))}</div>`;
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2400)}
function go(v,id){S.view=v;if(id!=null)S.openId=id;if(v==='admin'&&!requireAdmin())return;render();scrollTo(0,0)}
function render(){
  document.body.classList.toggle('home-view',S.view==='home');
  $('#avatar').textContent=S.user?S.user.name[0].toUpperCase():'?';
  $('#adminTag').textContent=S.view==='admin'?' ADMIN':'';
  ({home,detail,login,admin})[S.view]();
}

/* ===== 4. GIAO DIỆN NGƯỜI DÙNG ===== */
function card(p,index,focus,motion){
  const offset=index-focus,visible=Math.abs(offset)<=2;
  const entryOffset=offset+motion;
  const endFilter=offset===0?'none':Math.abs(offset)===1?'saturate(.72) brightness(.78)':'saturate(.55) brightness(.58)';
  const endOpacity=!visible?0:offset===0?1:Math.abs(offset)===1?.76:.42;
  return `<article class="showcase-card ${visible?'':'is-hidden'} ${motion?'is-arriving':''}" data-id="${p.id}" data-index="${index}" data-offset="${offset}" style="--shift:${offset*94}%;--turn:${-offset*17}deg;--z:${-Math.abs(offset)*260}px;--mobile-shift:${offset*94}%;--mobile-turn:${-offset*15}deg;--mobile-z:${-Math.abs(offset)*160}px;--entry-shift:${entryOffset*94}%;--entry-turn:${-entryOffset*17}deg;--entry-z:${-Math.abs(entryOffset)*260}px;--mobile-entry-shift:${entryOffset*94}%;--mobile-entry-turn:${-entryOffset*15}deg;--mobile-entry-z:${-Math.abs(entryOffset)*160}px;--end-filter:${endFilter};--end-opacity:${endOpacity};--mobile-end-opacity:${Math.abs(offset)>1?0:endOpacity};--stagger:${Math.min(Math.abs(offset),3)*55}ms" role="button" tabindex="${visible?'0':'-1'}" aria-label="${esc(p.title)}">
    <div class="showcase-cover">${tb(p)}</div><span class="showcase-kicker">FREE FIRE&nbsp; / &nbsp;${esc(p.cat)}</span>
    <div class="showcase-caption"><small>MOD COLLECTION&nbsp; · &nbsp;${String(index+1).padStart(2,'0')}</small><h2>${esc(p.title)}</h2><p>${esc(p.cat)}&nbsp; · &nbsp;${esc(p.date)}</p></div>
    <button class="showcase-open" type="button" data-open="${p.id}" aria-label="Xem ${esc(p.title)}">↗</button>
  </article>`;
}
function home(){
  const list=posts.filter(p=>p.on&&(S.cat==='Tất cả'||p.cat===S.cat)&&p.title.toLowerCase().includes(S.q.toLowerCase()));
  const pages=Math.max(1,Math.ceil(list.length/4));S.page=Math.min(S.page,pages);
  const cur=list.slice((S.page-1)*4,S.page*4);S.focus=Math.max(0,Math.min(S.focus||0,cur.length-1));
  const motion=S.motion||0;S.motion=0;
  const pageStart=Math.max(1,Math.min(S.page-2,pages-4));
  const visiblePages=Array.from({length:Math.min(5,pages)},(_,i)=>pageStart+i);
  const rows=list.map((p,i)=>`<article class="mod-row" data-list-open="${p.id}" role="button" tabindex="0" aria-label="Xem ${esc(p.title)}"><div class="mod-row-art">${tb(p)}</div><div class="mod-row-copy"><small>${esc(p.cat)} · MOD COLLECTION</small><h3>${esc(p.title)}</h3><p>Ngày đăng: ${esc(p.date)}</p></div><span class="mod-row-number">${String(i+1).padStart(2,'0')}</span><span class="mod-row-arrow" aria-hidden="true">↗</span></article>`).join('')||'<div class="mods-empty">Không có mod nào khớp với nội dung tìm kiếm.</div>';
  app.innerHTML=`<div class="home-page"><section class="home-scene">
    <div class="gallery-intro"><span class="eyebrow">FREE FIRE&nbsp; / &nbsp;MOD SKIN ARCHIVE</span><h1>Thỏa sức<br><em>lựa chọn</em> Mod của bạn.</h1><p>Khám phá bộ sưu tập skin và trang phục mới cho Free Fire.</p></div>
  <div class="gallery-stage" id="galleryStage" aria-label="Bộ sưu tập mod skin">${cur.map((p,i)=>card(p,i,S.focus,motion)).join('')||'<p class="meta" style="position:absolute;top:52%;left:50%;transform:translate(-50%,-50%)">Không có bài nào khớp. Thử từ khóa khác.</p>'}</div>
    ${cur.length>1?'<button class="carousel-arrow prev" id="prevCard" aria-label="Bản trước">‹</button><button class="carousel-arrow next" id="nextCard" aria-label="Bản tiếp theo">›</button>':''}
    <div class="gallery-tools"><div><span class="gallery-tools-label">Duyệt bộ sưu tập</span><div class="chips">${['Tất cả',...CATS].map(c=>`<button class="chip ${c===S.cat?'on':''}" data-cat="${c}">${c}</button>`).join('')}</div></div>
      <label class="search-wrap"><span class="search-icon" aria-hidden="true">⌕</span><input class="search" id="q" placeholder="Tìm skin, nhân vật..." value="${esc(S.q)}" aria-label="Tìm kiếm mod skin"></label></div>
    <div class="gallery-footer"><span class="archive-label"><strong>FEATURED</strong>&nbsp; / &nbsp;FULL</span><span>${String(cur.length?(S.page-1)*4+S.focus+1:0).padStart(2,'0')}&nbsp; / &nbsp;${String(list.length).padStart(2,'0')}</span>
      <div class="pager">${pages>5?'<button data-page-step="-1" aria-label="Trang trước" '+(S.page===1?'disabled':'')+'>‹</button>':''}${visiblePages.map(n=>`<button class="${n===S.page?'on':''}" data-pg="${n}" aria-label="Trang ${n}">${String(n).padStart(2,'0')}</button>`).join('')}${pages>5?'<button data-page-step="1" aria-label="Trang tiếp" '+(S.page===pages?'disabled':'')+'>›</button>':''}</div><a class="scroll-link" href="#allMods">SCROLL&nbsp; TO&nbsp; EXPLORE&nbsp; ↓</a></div>
  </section><section class="mods-shelf" id="allMods"><div class="mods-shelf-head"><div><small>FULL MOD ARCHIVE</small><h2>Tất cả bản mod</h2></div><span class="mods-shelf-count">${list.length} mục</span></div><div class="mods-list">${rows}</div></section></div>`;
  const moveFocus=delta=>{if(!list.length)return;const current=(S.page-1)*4+S.focus,next=(current+delta+list.length)%list.length;S.page=Math.floor(next/4)+1;S.focus=next%4;S.motion=delta;home()};
  const movePage=page=>{const next=Math.max(1,Math.min(pages,page));if(next===S.page)return;S.motion=next>S.page?1:-1;S.page=next;S.focus=0;home()};
  $('#q').oninput=e=>{S.q=e.target.value;S.page=1;S.focus=0;S.motion=0;home();const q=$('#q');q.focus();q.setSelectionRange(q.value.length,q.value.length)};
  app.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{S.cat=b.dataset.cat;S.page=1;S.focus=0;S.motion=1;home()});
  app.querySelectorAll('[data-pg]').forEach(b=>b.onclick=()=>movePage(+b.dataset.pg));
  app.querySelectorAll('[data-page-step]').forEach(b=>b.onclick=()=>movePage(S.page+(+b.dataset.pageStep)));
  $('#prevCard')?.addEventListener('click',()=>moveFocus(-1));$('#nextCard')?.addEventListener('click',()=>moveFocus(1));
  app.querySelectorAll('.showcase-card').forEach(a=>{
    a.onclick=e=>{if(e.target.closest('[data-open]')){go('detail',+a.dataset.id);return}const i=+a.dataset.index;if(i!==S.focus){S.motion=i>S.focus?1:-1;S.focus=i;home()}else go('detail',+a.dataset.id)};
    a.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();a.click()}};
  });
  app.querySelectorAll('[data-list-open]').forEach(a=>{a.onclick=()=>go('detail',+a.dataset.listOpen);a.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();a.click()}}});
  let startX=0,wheelAt=0;const stage=$('#galleryStage');
  stage.onpointerdown=e=>{startX=e.clientX};stage.onpointerup=e=>{const diff=e.clientX-startX;if(Math.abs(diff)>55)moveFocus(diff<0?1:-1)};
  stage.addEventListener('wheel',e=>{if(Math.abs(e.deltaX)<Math.abs(e.deltaY)&&!e.shiftKey)e.preventDefault();const now=Date.now();if(now-wheelAt<650)return;wheelAt=now;moveFocus((e.deltaX||e.deltaY)>0?1:-1)},{passive:false});
  window.onkeydown=e=>{if(S.view!=='home'||!cur.length)return;if(e.key==='ArrowRight')moveFocus(1);if(e.key==='ArrowLeft')moveFocus(-1)};
}
function detail(){
  const p=posts.find(x=>x.id===S.openId);if(!p)return go('home');
  app.innerHTML=`<button class="btn alt sm back" id="bk">‹ Quay về trang chủ</button><div class="detail"><span class="tag">● ${esc(p.cat)}</span><h1>${esc(p.title)}</h1>
  ${tb(p,'border-radius:12px')}
  <p class="meta">Ngày đăng: ${p.date}</p><pre>${esc(p.body)}</pre></div>`;
  $('#bk').onclick=()=>go('home');
}

/* ===== 5. ĐĂNG NHẬP: server kiểm tra rồi trả về vai trò ===== */
function login(){
  app.innerHTML=`<form class="box" id="lf"><h2>⚡ SKINFF</h2><p class="meta">Đăng nhập để dùng tài khoản của bạn.</p>
  <label>Tên đăng nhập</label><input id="un" autocomplete="username" required><label for="pw">Mật khẩu</label><div class="password-field"><input id="pw" type="password" autocomplete="current-password" required><button class="password-toggle" id="togglePassword" type="button" aria-label="Hiện mật khẩu" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m3 3 18 18"/></svg></button></div>
  <button class="btn" style="width:100%;margin-top:16px">Đăng nhập</button>
  </form>`;
  $('#togglePassword').onclick=()=>{
    const password=$('#pw'),show=password.type==='password';
    password.type=show?'text':'password';
    $('#togglePassword').classList.toggle('is-visible',show);
    $('#togglePassword').setAttribute('aria-label',show?'Ẩn mật khẩu':'Hiện mật khẩu');
    $('#togglePassword').setAttribute('aria-pressed',String(show));
  };
  $('#lf').onsubmit=e=>{e.preventDefault();
    const a=ACCOUNTS.find(x=>x.name===$('#un').value.trim()&&x.pass===$('#pw').value);
    if(!a)return toast('Sai tên đăng nhập hoặc mật khẩu');
    S.user={id:a.id,name:a.name,role:a.role};try{sessionStorage.setItem('u',JSON.stringify(S.user))}catch(e){}
    toast('Xin chào '+a.name);go(a.role==='admin'?'admin':'home')};
}

/* ===== 6. GIAO DIỆN ADMIN ===== */
const TABS={members:'👥 Quản lý thành viên',mods:'🎨 Quản lý mod skin',topup:'💳 Lịch sử nạp tiền',sys:'💾 Dung lượng hệ thống'};
const vnd=n=>n.toLocaleString('vi-VN')+' ₫';
function admin(){
  const total=ACCOUNTS.reduce((s,a)=>s+a.coin,0);
  let body='';
  if(S.tab==='members')body=`<div class="stats"><div class="stat"><span>Tổng thành viên</span><b>${ACCOUNTS.length}</b></div><div class="stat"><span>Số dư của user</span><b>${vnd(total)}</b></div></div>
   <div class="tw"><table><tr><th>ID</th><th>Tên đăng nhập</th><th>Email</th><th>Quyền</th></tr>${ACCOUNTS.map(a=>`<tr><td>#${a.id}</td><td>${esc(a.name)}</td><td>${esc(a.email)}</td><td>${a.role==='admin'?'FULL ADMIN':'User'}</td></tr>`).join('')}</table></div>`;
  else if(S.tab==='mods')body=`<div class="stats"><div class="stat"><span>Tổng bản mod</span><b>${posts.length}</b></div><div class="stat"><span>Đang bán/hiển thị</span><b>${posts.filter(p=>p.on).length}</b></div></div>
   <div style="display:flex;gap:8px;margin-bottom:10px"><button class="btn" id="newp">Đăng bài mod mới</button></div>
   <div class="tw"><table><tr><th>ID</th><th>Bản mod skin</th><th>Trạng thái</th><th>Thao tác</th></tr>${posts.map(p=>`<tr><td>#${p.id}</td><td><span class="mt" style="${p.img?`background-image:url('${p.img}')`:`background:linear-gradient(135deg,${p.g})`}"></span>${esc(p.title)}</td><td><span class="dot" style="background:${p.on?'var(--ok)':'var(--mu)'}"></span>${p.on?'Hiển thị':'Đang ẩn'}</td><td><button class="btn alt sm" data-t="${p.id}">${p.on?'Ẩn':'Hiện'}</button> <button class="btn bad sm" data-d="${p.id}">Xóa</button></td></tr>`).join('')}</table></div>`;
  else body='<p class="meta">Mục này chưa có dữ liệu mẫu. Bạn thêm vào cùng cách với hai mục đầu.</p>';
  app.innerHTML=`<h1>Bảng quản trị hệ thống</h1><p class="sub">Trang quản trị chỉ hiện với tài khoản có quyền admin.</p>
  <div class="tabs">${Object.entries(TABS).map(([k,v])=>`<button class="tab ${k===S.tab?'on':''}" data-tab="${k}">${v}</button>`).join('')}</div>${body}`;
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;admin()});
  if($('#newp'))$('#newp').onclick=newPost;
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{if(!requireAdmin())return;const p=posts.find(x=>x.id==b.dataset.t);p.on=!p.on;admin()});
  app.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(!requireAdmin())return;posts=posts.filter(x=>x.id!=b.dataset.d);toast('Đã xóa bài');admin()});
}
function newPost(){
  const d=$('#dlg');d.innerHTML=`<form method="dialog" id="pf"><h2 style="margin-top:0">Đăng bài mod skin mới</h2>
  <label>Tên bài viết mod *</label><input class="fld" id="pt" required placeholder="VD: Mod Skin FF OB54 V35">
  <label>Chuyên mục</label><select class="fld" id="pc">${CATS.map(c=>`<option>${c}</option>`).join('')}</select>
  <label>Ảnh thumbnail *</label><label class="drop"><input type="file" id="pi" accept="image/*" hidden><span id="dzt">Chạm để chọn ảnh từ máy</span></label>
  <label>Nội dung bài viết</label><textarea class="fld" id="pb" rows="6">Trang bị:\n\nPhiên bản hỗ trợ:\n\nLink tải về:</textarea>
  <div style="display:flex;gap:8px"><button class="btn" style="flex:1" value="ok">Đăng bài lên trang chủ</button><button class="btn alt" value="x" formnovalidate>Hủy bỏ</button></div></form>`;
  let img='';d.showModal();
  $('#pi').onchange=e=>{const f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/'))return toast('Chỉ nhận file ảnh (JPG, PNG, WebP)');
    const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1000/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);img=c.toDataURL('image/jpeg',.82);$('#dzt').innerHTML='<img src="'+img+'" alt="Ảnh xem trước">Chạm để đổi ảnh'};im.onerror=()=>toast('Không đọc được ảnh này, thử file khác');im.src=r.result};r.readAsDataURL(f)};
  $('#pf').onsubmit=e=>{if(e.submitter.value!=='ok')return;
    if(!requireAdmin())return; // kiểm tra quyền LẦN NỮA ngay lúc lưu
    if(!img){e.preventDefault();return toast('Chọn ảnh thumbnail trước khi đăng')}
    posts.unshift({id:Math.max(0,...posts.map(p=>p.id))+1,title:$('#pt').value.trim(),cat:$('#pc').value,date:new Date().toLocaleString('vi-VN'),g:GRAD[Math.floor(Math.random()*6)],on:true,img,body:$('#pb').value});
    toast('Đã đăng bài');admin()};
}

/* ===== 7. MENU / ĐIỀU HƯỚNG CHUNG ===== */
function menu(){
  document.querySelector('.menu')?.remove();
  const m=document.createElement('div');m.className='menu';
  m.innerHTML=(S.user?`<button disabled>Đang đăng nhập: <b>${esc(S.user.name)}</b> (${S.user.role})</button>`:'')+
   (S.user?'<button data-g="out">Đăng xuất</button>':'<button data-g="login">Đăng nhập</button>');
  document.body.append(m);
  m.onclick=e=>{const g=e.target.closest('button')?.dataset.g;if(!g)return;m.remove();
    if(g==='out'){S.user=null;try{sessionStorage.removeItem('u')}catch(e){}go('home')}else go(g)};
  setTimeout(()=>addEventListener('click',()=>m.remove(),{once:true}),0);
}
function sideMenu(){
  if(document.querySelector('.drawer-backdrop'))return;
  const backdrop=document.createElement('div');backdrop.className='drawer-backdrop';
  backdrop.innerHTML='<nav class="drawer" aria-label="Điều hướng"><div class="drawer-head"><strong>Menu</strong><button type="button" data-close aria-label="Đóng menu">×</button></div><button type="button" data-g="home">Trang chủ</button><button type="button" data-url="https://youtube.com/@chanbomaydozon?si=FO5h2G5JUa6aHPSJ">Kênh YouTube</button><button type="button" data-url="https://doithevip.com/">Nạp thẻ chiết khấu</button>'+(can('manage_posts')?'<button type="button" data-g="admin">Trang quản trị</button>':'')+'</nav>';
  document.body.append(backdrop);
  const burger=$('#burger');burger.setAttribute('aria-expanded','true');
  requestAnimationFrame(()=>backdrop.classList.add('open'));
  const close=()=>{backdrop.classList.remove('open');burger.setAttribute('aria-expanded','false');setTimeout(()=>backdrop.remove(),240)};
  backdrop.onclick=e=>{
    if(e.target===backdrop){close();return}
    const button=e.target.closest('button');if(!button)return;
    if(button.hasAttribute('data-close')){close();return}
    const url=button.dataset.url;
    if(url){window.open(url,'_blank','noopener,noreferrer');close();return}
    const view=button.dataset.g;
    if(view){close();go(view)}
  };
}
$('#avatar').onclick=e=>{e.stopPropagation();menu()};$('#burger').onclick=e=>{e.stopPropagation();sideMenu()};$('#logo').onclick=()=>go('home');
if(S.user&&S.user.role==='admin')S.view='admin';
render();
</script>
</body>
</html>
